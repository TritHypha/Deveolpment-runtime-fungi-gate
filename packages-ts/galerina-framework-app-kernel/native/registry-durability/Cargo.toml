[package]
name = "galerina-registry-durability-native"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[features]
fault-injection = []
static-profile-proof = []
recovery-evidence = ["fault-injection"]

[[bin]]
name = "registry-durability-fault-worker"
path = "src/bin/registry-durability-fault-worker.rs"
required-features = ["fault-injection"]

[[bin]]
name = "registry-durability-static-profile"
path = "src/bin/registry-durability-static-profile.rs"
required-features = ["static-profile-proof"]

[[bin]]
name = "registry-durability-recovery-worker"
path = "src/bin/registry-durability-recovery-worker.rs"
required-features = ["recovery-evidence"]

[[bin]]
name = "registry-durability-recovery-verifier"
path = "src/bin/registry-durability-recovery-verifier.rs"
required-features = ["recovery-evidence"]

[dependencies]
