name: platform-smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      mode:
        description: "Protected observation mode"
        required: true
        type: choice
        options: [observe, verify]
      producerCommit:
        description: "Exact Galerina producer commit"
        required: true
        type: string
      agentsCommit:
        description: "Exact AGENTS verifier commit"
        required: true
        type: string
      evidenceCommit:
        description: "Exact evidence commit (required for verify)"
        required: false
        type: string

permissions:
  contents: read

  # Hosted resource observations are advisory. RD-0873 verification runs
  # locally on Windows/WSL; a hosted smoke result does not establish native
  # lifecycle coverage or gate the local implementation.

jobs:
  resource-harness-windows-x64:
    name: RD-0873 resource harness (Windows x64)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - name: Validate pinned native observer and resource tests
        shell: pwsh
        run: |
          node scripts/build-process-tree-observer.mjs --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test --test-name-pattern="Task 6C-R" scripts/tests/logic-aig-source-origin-process-tree-resource.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  resource-harness-linux-x64:
    name: RD-0873 resource harness (Linux x64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - name: Validate pinned native observer and resource tests
        run: |
          node scripts/build-process-tree-observer.mjs --check
          if [ $? -ne 0 ]; then exit 2; fi
          node --test --test-name-pattern="Task 6C-R" scripts/tests/logic-aig-source-origin-process-tree-resource.test.mjs
          if [ $? -ne 0 ]; then exit 2; fi

  protected-dispatch-inputs:
    name: Validate protected RD-0873 dispatch inputs
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    environment: rd0873-task6-evidence
    steps:
      - name: Validate exact commit inputs and mode relationship
        env:
          MODE: ${{ inputs.mode }}
          PRODUCER: ${{ inputs.producerCommit }}
          AGENTS: ${{ inputs.agentsCommit }}
          EVIDENCE: ${{ inputs.evidenceCommit }}
        run: |
          node -e "const m=process.env.MODE,p=process.env.PRODUCER,a=process.env.AGENTS,e=process.env.EVIDENCE;if(!['observe','verify'].includes(m)||!/^[0-9a-f]{40}$/.test(p)||!/^[0-9a-f]{40}$/.test(a)||(m==='observe'&&e!=='')||(m==='verify'&&!/^[0-9a-f]{40}$/.test(e)))process.exit(2)"

  hosted-platforms:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows Server 2022 hosted proxy
            runner: windows-2022
            expected_os: windows-server-2022
          - name: macOS 14 arm64
            runner: macos-14
            expected_os: macos
          - name: Ubuntu 24.04 x64
            runner: ubuntu-24.04
            expected_os: ubuntu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: packages-ts/galerina-core-compiler/package-lock.json
      - name: Install the pinned compiler floor
        run: npm ci --prefix packages-ts/galerina-core-compiler
      - name: Prove platform-smoke refusal contracts
        run: node --test scripts/tests/platform-smoke.test.mjs
      - name: Prove Corpus runtime Node 20 compatibility
        run: node --test --test-name-pattern="Corpus runtime protection remains importable" scripts/tests/fungi-corpus-shard-execution.test.mjs
      - name: Run hermetic platform smoke
        run: node scripts/platform-smoke.mjs --json --expect-os ${{ matrix.expected_os }} > functional-${{ matrix.expected_os }}.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "18"
      - name: Prove Corpus runtime Node 18 compatibility
        run: node --test --test-name-pattern="Corpus runtime protection remains importable" scripts/tests/fungi-corpus-shard-execution.test.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: functional-${{ matrix.expected_os }}
          path: functional-${{ matrix.expected_os }}.json
          if-no-files-found: error

  official-linux-containers:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Debian 12.15 x64
            image: debian:12.15-slim@sha256:7b140f374b289a7c2befc338f42ebe6441b7ea838a042bbd5acbfca6ec875818
            expected_os: debian
          - name: Fedora 43 x64
            image: fedora:43@sha256:762d73ba1c455232b0272c5d445a34f36c4b9f421cbc05ce8102552325b6a222
            expected_os: fedora
    runs-on: ubuntu-24.04
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: packages-ts/galerina-core-compiler/package-lock.json
      - name: Install the pinned compiler floor
        run: npm ci --prefix packages-ts/galerina-core-compiler
      - name: Prove platform-smoke refusal contracts
        run: node --test scripts/tests/platform-smoke.test.mjs
      - name: Run hermetic platform smoke
        run: node scripts/platform-smoke.mjs --json --expect-os ${{ matrix.expected_os }} > functional-${{ matrix.expected_os }}.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: functional-${{ matrix.expected_os }}
          path: functional-${{ matrix.expected_os }}.json
          if-no-files-found: error

  # GitHub-hosted Windows is Windows Server, not Windows 11. This job stays
  # visibly skipped until the owner supplies a runner with the exact labels.
  windows-11-self-hosted:
    if: ${{ vars.GALERINA_WINDOWS11_RUNNER == 'enabled' }}
    runs-on: [self-hosted, Windows, X64, windows-11]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: packages-ts/galerina-core-compiler/package-lock.json
      - run: npm ci --prefix packages-ts/galerina-core-compiler
      - run: node --test scripts/tests/platform-smoke.test.mjs
      - run: node scripts/platform-smoke.mjs --json --expect-os windows-11 > functional-windows-11.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: functional-windows-11
          path: functional-windows-11.json
          if-no-files-found: error

  windows-10-self-hosted:
    if: ${{ vars.GALERINA_WINDOWS10_RUNNER == 'enabled' }}
    runs-on: [self-hosted, Windows, X64, windows-10]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: packages-ts/galerina-core-compiler/package-lock.json
      - run: npm ci --prefix packages-ts/galerina-core-compiler
      - run: node --test scripts/tests/platform-smoke.test.mjs
      - run: node scripts/platform-smoke.mjs --json --expect-os windows-10 > functional-windows-10.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: functional-windows-10
          path: functional-windows-10.json
          if-no-files-found: error

  # No third-party Mint container is trusted as release evidence. An actual
  # Linux Mint 22 runner can opt in without weakening that supply-chain rule.
  linux-mint-22-self-hosted:
    if: ${{ vars.GALERINA_MINT22_RUNNER == 'enabled' }}
    runs-on: [self-hosted, Linux, X64, linux-mint-22]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: packages-ts/galerina-core-compiler/package-lock.json
      - run: npm ci --prefix packages-ts/galerina-core-compiler
      - run: node --test scripts/tests/platform-smoke.test.mjs
      - run: node scripts/platform-smoke.mjs --json --expect-os linuxmint > functional-linuxmint.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: functional-linuxmint
          path: functional-linuxmint.json
          if-no-files-found: error
